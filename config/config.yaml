# ==================================================================
# Global configuration for the AEV IDS & TARA project.
# ==================================================================

simulation:
  random_seed: 42
  sample_rate_hz: 20
  duration_seconds: 120
  output_dir: "data"

vehicle:
  speed_kmh:
    min: 0.0
    max: 160.0
  acceleration_ms2:
    min: -4.0
    max: 3.0
  steering_deg:
    min: -180.0
    max: 180.0
  brake_percent:
    min: 0.0
    max: 100.0

battery:
  soc_percent:
    start: 85.0
    min: 5.0
    max: 100.0
  temperature_c:
    ambient: 25.0
    max_safe: 55.0
  nominal_voltage_v: 400.0
  max_current_a: 250.0

charging:
  station_power_kw: 50.0
  grid_frequency_hz:
    nominal: 50.0
    tolerance: 0.2

can:
  jitter_fraction: 0.03
  messages:
    - arbitration_id: 0x0C0
      name: "PWT_Speed"
      ecu: "PowertrainECU"
      asset: "Powertrain ECU"
      cycle_ms: 20
      signals:
        - name: "speed_kmh"
          start: 0
          length: 2
          scale: 0.01
          offset: 0.0
        - name: "acceleration_ms2"
          start: 2
          length: 2
          scale: 0.001
          offset: -10.0

    - arbitration_id: 0x0D0
      name: "CHS_Steering"
      ecu: "ChassisECU"
      asset: "Steering/ADAS ECU"
      cycle_ms: 20
      signals:
        - name: "steering_deg"
          start: 0
          length: 2
          scale: 0.01
          offset: -360.0
        - name: "brake_percent"
          start: 2
          length: 2
          scale: 0.01
          offset: 0.0

    - arbitration_id: 0x1A0
      name: "BMS_State"
      ecu: "BatteryECU"
      asset: "Battery Management (BMS)"
      cycle_ms: 100
      signals:
        - name: "battery_soc"
          start: 0
          length: 2
          scale: 0.01
          offset: 0.0
        - name: "battery_temp_c"
          start: 2
          length: 2
          scale: 0.01
          offset: -40.0
        - name: "pack_voltage_v"
          start: 4
          length: 2
          scale: 0.1
          offset: 0.0

    - arbitration_id: 0x1B0
      name: "BMS_Current"
      ecu: "BatteryECU"
      asset: "Battery Management (BMS)"
      cycle_ms: 100
      signals:
        - name: "pack_current_a"
          start: 0
          length: 2
          scale: 0.01
          offset: -300.0

    - arbitration_id: 0x2A0
      name: "CHG_Status"
      ecu: "ChargingECU"
      asset: "Charging Controller"
      cycle_ms: 200
      signals:
        - name: "charging_state"
          start: 0
          length: 1
          scale: 1.0
          offset: 0.0
        - name: "grid_frequency_hz"
          start: 1
          length: 2
          scale: 0.01
          offset: 0.0

assets:
  - name: "Powertrain ECU"
    type: "Control ECU"
    cia: "Integrity"
    criticality: "High"
  - name: "Steering/ADAS ECU"
    type: "Control ECU"
    cia: "Integrity"
    criticality: "High"
  - name: "Battery Management (BMS)"
    type: "Energy ECU"
    cia: "Integrity/Availability"
    criticality: "High"
  - name: "Charging Controller"
    type: "Energy ECU"
    cia: "Integrity/Availability"
    criticality: "High"
  - name: "CAN Bus"
    type: "Network"
    cia: "Availability/Integrity"
    criticality: "High"

attacks:
  spoofing:
    enabled: true
    target_message: "PWT_Speed"
    start_s: 20.0
    end_s: 30.0
    inject_rate_ms: 10.0
    forged_speed_kmh: 200.0

  replay:
    enabled: true
    target_message: "CHS_Steering"
    capture_start_s: 5.0
    capture_end_s: 8.0
    replay_start_s: 45.0
    end_s: 50.0

  dos:
    enabled: true
    start_s: 60.0
    end_s: 65.0
    flood_id: 0x000
    flood_rate_ms: 1.0

  injection:
    enabled: true
    start_s: 75.0
    end_s: 80.0
    rogue_id: 0x666
    inject_rate_ms: 15.0

  tampering:
    enabled: true
    target_message: "BMS_State"
    start_s: 90.0
    end_s: 95.0
    fraction: 0.5

  charging_attack:
    enabled: true
    target_message: "CHG_Status"
    start_s: 105.0
    end_s: 115.0
    false_grid_freq_hz: 47.0
    oscillation_hz: 2.0

# ------------------------------------------------------------------
# Feature engineering / dataset pipeline (Phase 4).
#
#   window_ms  : length of each sliding window in milliseconds
#   stride_ms  : how far the window advances each step (overlap if < window)
#   split      : fractions for time-aware train/val/test split
#   known_ids  : arbitration IDs considered legitimate (auto-derived from
#                the can.messages above at runtime; listed here only for
#                reference / override).
# ------------------------------------------------------------------
features:
  window_ms: 500
  stride_ms: 250
  split:
    train: 0.6
    val: 0.2
    test: 0.2

logging:
  level: "INFO"